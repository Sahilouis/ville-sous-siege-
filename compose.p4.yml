networks:
  dmz:
    name: ville-sous-siege-_dmz
    external: true
  soc:
    name: ville-sous-siege-_soc
    driver: bridge

volumes:
  suricata-logs:
    name: ville-sous-siege-suricata-logs
  es-data:
    name: ville-sous-siege-es-data

services:

  suricata-ids:
    image: jasonish/suricata:latest
    container_name: suricata-ids
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - suricata-logs:/var/log/suricata
      - ./suricata-init.sh:/suricata-init.sh:ro
    entrypoint: ["sh", "/suricata-init.sh"]
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: elasticsearch
    networks:
      - soc
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    networks:
      - soc
    volumes:
      - suricata-logs:/var/log/suricata:ro
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    command: filebeat -e --strict.perms=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: kibana:8.13.0
    container_name: kibana
    networks:
      - soc
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 768m
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
