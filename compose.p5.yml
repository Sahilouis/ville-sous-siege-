networks:
  lan:
    name: ville-sous-siege-_lan
    external: true
  dmz:
    name: ville-sous-siege-_dmz
    external: true
  attacker:
    name: ville-sous-siege-_attacker
    external: true

volumes:
  freeradius-data:
    name: ville-sous-siege-freeradius-data

services:

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius
    networks:
      - lan
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./config/freeradius/users:/etc/freeradius/mods-config/files/authorize:ro
      - ./config/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
    command: freeradius -X
    restart: unless-stopped

  radius-client:
    image: alpine:3.19
    container_name: radius-client
    command: >
      sh -c "apk add --no-cache freeradius-client > /dev/null 2>&1 && sleep infinity"
    networks:
      - lan
    restart: unless-stopped
